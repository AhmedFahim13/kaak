# Builds both editions, signed, and publishes them as a GitHub Release.
# Trigger: push a tag like v0.7.0   (git tag v0.7.0 && git push origin v0.7.0)
# Testers get updates through Obtainium watching this repo's Releases.
name: Build and release APKs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KAAK_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the KAAK_KEYSTORE_B64, KAAK_STORE_PASSWORD, KAAK_KEY_ALIAS and KAAK_KEY_PASSWORD secrets first (see BETA.md)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          echo "KAAK_KEYSTORE=release.jks" >> "$GITHUB_ENV"

      - name: Version from tag and run number
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then NAME="0.0.$GITHUB_RUN_NUMBER-dev"; fi
          echo "KAAK_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "KAAK_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          KAAK_STORE_PASSWORD: ${{ secrets.KAAK_STORE_PASSWORD }}
          KAAK_KEY_ALIAS: ${{ secrets.KAAK_KEY_ALIAS }}
          KAAK_KEY_PASSWORD: ${{ secrets.KAAK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testFullDebugUnitTest assembleFullRelease assembleStudyRelease

      - name: Name the APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/full/release/*.apk "out/kaak-$KAAK_VERSION_NAME.apk"
          cp app/build/outputs/apk/study/release/*.apk "out/kaak-study-$KAAK_VERSION_NAME.apk"
          ls -la out
          rm -f release.jks

      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: out/*.apk
          generate_release_notes: true

      - uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          name: kaak-apks
          path: out/*.apk
